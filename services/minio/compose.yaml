# MinIO (S3 storage) · minio:9000 · S3_ENDPOINT, AWS_* · console http://127.0.0.1:9001
#
# Note: MinIO stopped publishing updated community edition images in 2025.
# It is fine for local development; for something maintained, copy this directory
# and swap the image for another S3-compatible one (SeaweedFS, Garage...).
services:
  # The project's network is internal: the gateway publishes the UI.
  gateway:
    environment:
      ROKE_FORWARD_MINIO: "49001 minio:9001"
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:49001"

  box:
    environment:
      S3_ENDPOINT: http://minio:9000
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_USER:-dev}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-devdevdev}
      AWS_REGION: us-east-1
    depends_on:
      minio:
        condition: service_started

  minio:
    image: minio/minio:${MINIO_VERSION:-latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-devdevdev}
    volumes:
      - minio-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  minio-data:
