# Mailpit (test SMTP server) · mailpit:1025 · SMTP_HOST/SMTP_PORT · UI http://127.0.0.1:8025
services:
  box:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAILPIT_API: http://mailpit:8025/api
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    security_opt:
      - no-new-privileges:true
