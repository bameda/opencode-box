# Jaeger (OpenTelemetry traces) · OTLP on jaeger:4317/4318 · OTEL_EXPORTER_OTLP_ENDPOINT · UI http://127.0.0.1:16686
services:
  box:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      JAEGER_QUERY_URL: http://jaeger:16686
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.23.0}
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    security_opt:
      - no-new-privileges:true
