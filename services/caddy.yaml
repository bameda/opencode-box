# Caddy (reverse proxy) · http://127.0.0.1:8080 -> opencode:3000 · edit services/caddy/Caddyfile
services:
  opencode:
    environment:
      PROXY_URL: http://127.0.0.1:${CADDY_PORT:-8080}
    depends_on:
      caddy:
        condition: service_started

  caddy:
    image: caddy:${CADDY_VERSION:-2}-alpine
    environment:
      PROXY_UPSTREAM: ${PROXY_UPSTREAM:-opencode:3000}
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "127.0.0.1:${CADDY_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
