# PostgreSQL · postgres:5432 · DATABASE_URL, PGHOST/PGUSER/PGPASSWORD/PGDATABASE
services:
  opencode:
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-dev}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev}
      PGDATABASE: ${POSTGRES_DB:-app}
      DATABASE_URL: postgres://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # postgres:18+ stores data under /var/lib/postgresql; if you move to 18,
    # change the volume's mount point.
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
