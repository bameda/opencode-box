# Base: just the box where the coding agent runs. Services (databases, caches, mail,
# proxy...) are added from services/<name>/compose.yaml with "ocbox -s".
# Don't run this directly: use bin/ocbox.

services:
  box:
    image: ocbox:latest
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        OCBOX_AGENTS: ${OCBOX_AGENTS:-claude opencode}
        OCBOX_AGENT_VERSIONS: ${OCBOX_AGENT_VERSIONS:-}
        POSTGRES_CLIENT_VERSION: ${POSTGRES_CLIENT_VERSION:-18}
        INSTALL_SERENA: ${INSTALL_SERENA:-1}
        SERENA_VERSION: ${SERENA_VERSION:-2.1.0}
    init: true
    stdin_open: true
    tty: true
    working_dir: ${PROJECT_DIR:?Start the container with bin/ocbox}
    # Your settings and secrets, global and the project's, from your ocbox
    # configuration directory (the last one wins).
    env_file:
      - path: ${OCBOX_CONFIG_DIR:?Start the container with bin/ocbox}/ocbox.env
        required: false
      - path: ${OCBOX_CONFIG_DIR}/secrets.env
        required: false
      - path: ${OCBOX_PROJECT_CONFIG}/project.env
        required: false
      - path: ${OCBOX_PROJECT_CONFIG}/secrets.env
        required: false
    environment:
      # The coding agent to run; chosen by bin/ocbox.
      OCBOX_AGENT: ${OCBOX_AGENT:?Start the container with bin/ocbox}
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}
      MISE_TRUSTED_CONFIG_PATHS: ${PROJECT_DIR}
      # Active services, so the agent knows what is available.
      OCBOX_SERVICES: ${OCBOX_SERVICES:-}
      # Serena (semantic MCP); controlled by bin/ocbox.
      OCBOX_SERENA: ${OCBOX_SERENA:-0}
      OCBOX_SERENA_DASHBOARD: ${OCBOX_SERENA_DASHBOARD:-0}
      OCBOX_SERENA_CODEMODE: ${OCBOX_SERENA_CODEMODE:-0}
    volumes:
      # The only writable host path: the project (at the same path).
      - ${PROJECT_DIR}:${PROJECT_DIR}
      # The box's own $HOME (auth, sessions, caches, mise...).
      - ocbox-home:/home/dev
      # Your configuration for the selected agent (read-only); its setup.sh
      # links it where the agent reads it.
      - ${OCBOX_CONFIG_DIR}/agents/${OCBOX_AGENT}:/run/ocbox/agent-config:ro
      # The agents' install and setup scripts and the box's instructions,
      # mounted so that updates arrive with git pull, without a rebuild.
      - ./agents:/opt/ocbox/agents:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 4096

volumes:
  # Shared across projects; created by bin/ocbox. External so that
  # "ocbox --purge" never deletes your login or caches.
  ocbox-home:
    name: ocbox-home
    external: true
